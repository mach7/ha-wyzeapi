name: HACS Action

on:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Action
    if: github.actor == 'mach7' && github.triggering_actor == 'mach7'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v3"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
