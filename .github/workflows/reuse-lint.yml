name: Reuse Lint

on:
  workflow_dispatch:

jobs:
  reuse:
    name: Reuse Lint
    if: github.actor == 'mach7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - run: pip install reuse
      - run: reuse lint
